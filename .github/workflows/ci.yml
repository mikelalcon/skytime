name: CI

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Temporal CLI
        uses: temporalio/setup-temporal@v0

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race ./... -count=1

      - name: build extbin
        run: go build -o /tmp/extbin ./examples/http-github-webhook/cmd/extbin

      - name: extbin test (Tier-3 .star tests)
        run: /tmp/extbin test ./examples/http-github-webhook/

      - name: walkthrough smoke (EX-04 — public GitHub API)
        env:
          EXTBIN: /tmp/extbin
        run: bash .github/workflows/scripts/walkthrough_smoke.sh
